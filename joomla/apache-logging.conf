# =====================================================================
#  Apache (contenedor Joomla) - exportación de logs de acceso a volumen
#
#  En la imagen oficial /var/log/apache2/access.log es un enlace simbólico a
#  /dev/stdout, por lo que compartir ese directorio NO produce archivos.
#  Aquí se añade un registro GLOBAL adicional (todas las vhosts) escrito en
#  /var/log/joomla, que es un volumen nombrado compartido con PostgreSQL
#  (file_fdw -> Grafana) y con Jupyter.
#
#  mod_remoteip (ya habilitado en la imagen) sustituye la IP del proxy por la
#  IP real del cliente tomada de X-Forwarded-For:
#     %a     -> IP del cliente original (de X-Forwarded-For)
#     %{c}a  -> IP del par TCP real (el contenedor nginx)
#  (mod_remoteip elimina X-Forwarded-For tras procesarla; por eso se registra
#   X-Forwarded-Proto como evidencia de las cabeceras inyectadas por Nginx)
# =====================================================================

ServerName joomla

LogFormat "%{%Y-%m-%dT%H:%M:%S%z}t\t%a\t%{c}a\t%{X-Forwarded-Proto}i\t%m\t%U%q\t%H\t%>s\t%B\t%D\t%k\t%{Referer}i\t%{User-Agent}i" parcial_tsv

# Las sondas del healthcheck de Docker (curl a 127.0.0.1 cada 10 s) no se registran
SetEnvIf Remote_Addr "^127\.0\.0\.1$" sonda_local

GlobalLog /var/log/joomla/apache_access.log parcial_tsv env=!sonda_local
