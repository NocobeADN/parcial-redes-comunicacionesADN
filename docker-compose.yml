# =====================================================================
#  Parcial 2 práctico - Comunicaciones (Ingeniería Mecatrónica)
#  Despliegue multi-contenedor: nginx + joomla + postgresql + jupyter + grafana
#
#  Arranque (zero-touch):   cp .env.example .env  &&  docker compose up -d
#
#  Todas las variables tienen un valor por defecto (${VAR:-valor}) idéntico
#  al de .env.example, así el despliegue no falla aunque falte el archivo .env.
# =====================================================================

x-comun: &comun
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # -------------------------------------------------------------------
  # 1) Edge router / proxy inverso. ÚNICO servicio con puerto publicado.
  # -------------------------------------------------------------------
  nginx:
    <<: *comun
    image: nginx:1.31-alpine
    hostname: nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      TZ: ${TZ:-America/Bogota}
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Registro de accesos centralizado (TSV) compartido con PostgreSQL y Jupyter
      - nginx_logs:/var/log/nginx-parcial
    networks:
      - frontend_net
    depends_on:
      joomla:
        condition: service_healthy
      jupyter:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------
  # 2) CMS Joomla (Apache + PHP) sobre PostgreSQL, con instalación desatendida.
  # -------------------------------------------------------------------
  joomla:
    <<: *comun
    image: joomla:6.1.3-php8.4-apache
    hostname: joomla
    # Envoltorio del entrypoint oficial: instala Joomla, siembra contenido y arranca Apache
    entrypoint: ["bash", "/opt/parcial/joomla-start.sh"]
    environment:
      TZ: ${TZ:-America/Bogota}
      JOOMLA_DB_TYPE: pgsql
      JOOMLA_DB_HOST: database            # nombre de servicio -> DNS embebido 127.0.0.11, puerto 5432
      JOOMLA_DB_NAME: ${POSTGRES_DB:-joomla}
      JOOMLA_DB_USER: ${JOOMLA_DB_USER:-joomla_app}
      JOOMLA_DB_PASSWORD: ${JOOMLA_DB_PASSWORD:-JoomlaApp_Parcial2026}
      JOOMLA_DB_PREFIX: ${JOOMLA_DB_PREFIX:-jos_}
      JOOMLA_SITE_NAME: ${JOOMLA_SITE_NAME:-Portal Academico e Industrial - Parcial Comunicaciones}
      JOOMLA_ADMIN_USER: ${JOOMLA_ADMIN_USER:-Administrador del Portal}
      JOOMLA_ADMIN_USERNAME: ${JOOMLA_ADMIN_USERNAME:-admin}
      JOOMLA_ADMIN_PASSWORD: ${JOOMLA_ADMIN_PASSWORD:-AdminJoomla_2026}
      JOOMLA_ADMIN_EMAIL: ${JOOMLA_ADMIN_EMAIL:-admin@parcial.local}
    volumes:
      - joomla_data:/var/www/html                     # assets/código del CMS (volumen nombrado)
      - joomla_logs:/var/log/joomla                   # logs de Apache exportados (volumen compartido)
      - ./joomla:/opt/parcial:ro                      # scripts de arranque y siembra
      - ./joomla/apache-logging.conf:/etc/apache2/conf-enabled/zz-parcial-logging.conf:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/configuration.php && curl -fsS -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s

  # -------------------------------------------------------------------
  # 3) PostgreSQL 16 (obligatorio). Solo en backend_net (red interna, sin salida).
  # -------------------------------------------------------------------
  database:
    <<: *comun
    image: postgres:16-alpine
    hostname: database
    # Parámetros de Capa 4: keep-alive TCP del lado servidor para conexiones inactivas
    command:
      - postgres
      - -c
      - tcp_keepalives_idle=60
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=6
      - -c
      - log_timezone=${TZ:-America/Bogota}
      - -c
      - timezone=${TZ:-America/Bogota}
    environment:
      TZ: ${TZ:-America/Bogota}
      POSTGRES_DB: ${POSTGRES_DB:-joomla}
      POSTGRES_USER: ${POSTGRES_USER:-dba_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PgAdmin_Parcial2026}
      # Usadas por los scripts de /docker-entrypoint-initdb.d para crear los roles
      JOOMLA_DB_USER: ${JOOMLA_DB_USER:-joomla_app}
      JOOMLA_DB_PASSWORD: ${JOOMLA_DB_PASSWORD:-JoomlaApp_Parcial2026}
      JOOMLA_DB_PREFIX: ${JOOMLA_DB_PREFIX:-jos_}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-GrafanaReader_2026}
      ANALISTA_DB_USER: ${ANALISTA_DB_USER:-analista}
      ANALISTA_DB_PASSWORD: ${ANALISTA_DB_PASSWORD:-Analista_Parcial2026}
    volumes:
      - pg_data:/var/lib/postgresql/data              # persistencia (volumen nombrado)
      - ./database/init:/docker-entrypoint-initdb.d:ro
      # Fuentes de logs leídas con file_fdw (solo lectura)
      - nginx_logs:/var/log/fuentes/nginx:ro
      - joomla_logs:/var/log/fuentes/joomla:ro
    networks:
      - backend_net
    # Sin "ports:": el 5432 NO se publica en el host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # -------------------------------------------------------------------
  # 4) JupyterLab con cuaderno precargado (bind-mount) y librerías de análisis.
  # -------------------------------------------------------------------
  jupyter:
    <<: *comun
    build:
      context: ./jupyter
    image: parcial-comunicaciones/jupyter:1.0
    hostname: jupyter
    environment:
      TZ: ${TZ:-America/Bogota}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-parcial2026}
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-joomla}
      DB_USER: ${ANALISTA_DB_USER:-analista}
      DB_PASSWORD: ${ANALISTA_DB_PASSWORD:-Analista_Parcial2026}
      PROXY_URL: http://nginx
      # Solo para la celda del cuaderno que inicia sesión en /administrator y genera registros de actividad
      JOOMLA_ADMIN_USERNAME: ${JOOMLA_ADMIN_USERNAME:-admin}
      JOOMLA_ADMIN_PASSWORD: ${JOOMLA_ADMIN_PASSWORD:-AdminJoomla_2026}
    volumes:
      - ./jupyter/notebooks:/home/jovyan/work         # bind-mount del cuaderno precargado
      - nginx_logs:/home/jovyan/logs/nginx:ro
      - joomla_logs:/home/jovyan/logs/joomla:ro
    networks:
      - frontend_net
      - backend_net      # necesario para consultar PostgreSQL con psycopg2 (ver INFORME.md)
    depends_on:
      database:
        condition: service_healthy

  # -------------------------------------------------------------------
  # 5) Grafana con datasource y dashboard aprovisionados declarativamente.
  # -------------------------------------------------------------------
  grafana:
    <<: *comun
    image: grafana/grafana:13.2.2
    hostname: grafana
    environment:
      TZ: ${TZ:-America/Bogota}
      GF_SERVER_ROOT_URL: http://localhost:${HTTP_PORT:-80}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-AdminGrafana_2026}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/joomla_logs.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Consumidas por provisioning/datasources/datasource.yml
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-GrafanaReader_2026}
      GRAFANA_DB_NAME: ${POSTGRES_DB:-joomla}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - frontend_net
      - backend_net      # consulta métricas directamente en PostgreSQL
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/grafana/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

# ---------------------------------------------------------------------
# Redes (Capa 2 / Capa 3): dos puentes Linux independientes.
# ---------------------------------------------------------------------
networks:
  frontend_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-parcial-fe
    ipam:
      config:
        - subnet: ${FRONTEND_SUBNET:-10.201.10.0/24}
  backend_net:
    driver: bridge
    internal: true       # sin gateway/NAT hacia el exterior: la BD no ve la red externa
    driver_opts:
      com.docker.network.bridge.name: br-parcial-be
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-10.201.20.0/24}

# ---------------------------------------------------------------------
# Volúmenes nombrados (persistencia)
# ---------------------------------------------------------------------
volumes:
  pg_data:
  joomla_data:
  joomla_logs:
  nginx_logs:
  grafana_data:
