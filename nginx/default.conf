# =====================================================================
#  Nginx - Edge Router / Reverse Proxy (único punto de entrada, TCP/80)
#  Este archivo se incluye dentro del bloque http{} de /etc/nginx/nginx.conf
# =====================================================================

# --- Capa 3: resolución dinámica de nombres con el DNS embebido de Docker ---
# 127.0.0.11 es el resolvedor que Docker inyecta en cada contenedor conectado
# a una red definida por el usuario. valid=10s -> se re-resuelve cada 10 s,
# así un contenedor recreado (nueva IP) se vuelve a encontrar sin reiniciar Nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# --- Capa 7: soporte de WebSocket (HTTP/1.1 Upgrade) ---
# Si el cliente envía "Upgrade: websocket" se reenvía "Connection: upgrade";
# si no, se envía Connection vacío para poder reutilizar conexiones keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# --- Registro de accesos centralizado (TSV) ---
# Un campo por columna separado por TAB. escape=default convierte comillas,
# barras y bytes no imprimibles en \xHH, por lo que un TAB nunca aparece
# dentro de un campo. PostgreSQL lee este archivo con file_fdw.
log_format parcial_tsv escape=default
    '$msec\t$time_iso8601\t$remote_addr\t$http_x_forwarded_for\t'
    '$request_method\t$request_uri\t$server_protocol\t$status\t'
    '$body_bytes_sent\t$request_time\t$upstream_addr\t$upstream_status\t'
    '$upstream_response_time\t$upstream_connect_time\t$connection\t'
    '$connection_requests\t$servicio\t$http_host\t$http_referer\t$http_user_agent';

# --- Capa 4: grupos upstream con pool de conexiones TCP persistentes ---
# "resolve" + "zone" = la IP del backend se obtiene del DNS de Docker en caliente.
# "keepalive N" = Nginx mantiene hasta N conexiones TCP ociosas abiertas hacia
# cada backend y las reutiliza (sin nuevo three-way handshake por petición).
upstream joomla_up {
    zone joomla_up 64k;
    server joomla:80 resolve;
    keepalive 16;
    keepalive_timeout 60s;
}

upstream jupyter_up {
    zone jupyter_up 64k;
    server jupyter:8888 resolve;
    keepalive 8;
}

upstream grafana_up {
    zone grafana_up 64k;
    server grafana:3000 resolve;
    keepalive 8;
}

server {
    listen 80 default_server;
    server_name _;

    # Redirecciones relativas: funcionan aunque el host publique otro puerto
    absolute_redirect off;

    # Keep-alive del lado cliente (navegador <-> Nginx)
    keepalive_timeout 65s;
    keepalive_requests 1000;

    # Registro: formato combinado a stdout (docker logs) + TSV al volumen compartido
    set $servicio nginx;
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx-parcial/access.log parcial_tsv;

    # --- Cabeceras HTTP que Nginx inyecta hacia los backends (Capa 7) ---
    proxy_http_version 1.1;                                   # requerido para keep-alive y Upgrade
    proxy_set_header Host              $http_host;            # host:puerto original del cliente
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;  # cadena de IPs origen
    proxy_set_header X-Forwarded-Proto $scheme;               # http / https original
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Upgrade           $http_upgrade;         # WebSocket
    proxy_set_header Connection        $connection_upgrade;   # "upgrade" o vacío (keep-alive)
    proxy_connect_timeout 10s;

    # Health-check interno (no se registra)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------ Jupyter (base_url=/jupyter/) ------------------
    location = /jupyter { return 301 /jupyter/; }
    location /jupyter/ {
        set $servicio jupyter;
        proxy_pass http://jupyter_up;          # sin URI: se conserva el prefijo /jupyter/
        proxy_read_timeout 3600s;              # WebSocket del kernel: conexiones de larga duración
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 100m;             # subida de archivos/cuadernos
    }

    # ------------------ Grafana (serve_from_sub_path) ------------------
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
        set $servicio grafana;
        proxy_pass http://grafana_up;          # Grafana sirve bajo /grafana/
        proxy_read_timeout 300s;               # Grafana Live usa WebSocket en /grafana/api/live/ws
    }

    # ------------------ Joomla (raíz del sitio) ------------------
    location / {
        set $servicio joomla;
        proxy_pass http://joomla_up;
        client_max_body_size 64m;
        proxy_read_timeout 120s;
    }
}
